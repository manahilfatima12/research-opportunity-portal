
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Research Opportunity Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div>
                <h1>Research Opportunity Portal</h1>
                <p>Discover research opportunities at your university</p>
            </div>
            <button id="addButton" class="primary-button">
                + Add Opportunity
            </button>
        </div>
    </header>

    <main class="container">
        <section class="welcome-section">
            <h2>Explore Opportunities</h2>
            <p>Find research projects, connect with faculty, and explore new ideas.</p>
        </section>

        <section class="toolbar">
            <input
                type="search"
                id="searchInput"
                placeholder="Search by title, faculty, or research area..."
                aria-label="Search opportunities"
            >

            <select id="statusFilter" aria-label="Filter by status">
                <option value="All">All Statuses</option>
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
            </select>
        </section>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <section id="opportunityList" class="opportunity-grid">
            <p>Loading opportunities...</p>
        </section>
    </main>

    <!-- Form for creating or editing an opportunity -->
    <div id="formModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-heading">
                <h2 id="formTitle">Add Research Opportunity</h2>
                <button type="button" id="closeFormButton" class="close-button"
                    aria-label="Close form">&times;</button>
            </div>

            <form id="opportunityForm">
                <label for="title">Opportunity Title *</label>
                <input type="text" id="title" name="title" required maxlength="255">

                <label for="description">Description *</label>
                <textarea id="description" name="description" required></textarea>

                <label for="research_area">Research Area *</label>
                <input type="text" id="research_area" name="research_area" required maxlength="150">

                <label for="faculty_name">Faculty Member Name *</label>
                <input type="text" id="faculty_name" name="faculty_name" required maxlength="150">

                <label for="department">Department *</label>
                <input type="text" id="department" name="department" required maxlength="150">

                <label for="required_skills">Required Skills *</label>
                <input type="text" id="required_skills" name="required_skills"
                    placeholder="e.g. Python, teamwork, data analysis"
                    required maxlength="500">

                <label for="available_positions">Available Positions *</label>
                <input type="number" id="available_positions" name="available_positions"
                    min="1" step="1" required>

                <label for="application_deadline">Application Deadline *</label>
                <input type="date" id="application_deadline" name="application_deadline" required>

                <label for="status">Status *</label>
                <select id="status" name="status" required>
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                </select>

                <div class="form-actions">
                    <button type="button" id="cancelButton" class="secondary-button">
                        Cancel
                    </button>
                    <button type="submit" id="saveButton" class="primary-button">
                        Save Opportunity
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dialog for viewing one opportunity -->
    <div id="detailsModal" class="modal hidden">
        <div class="modal-content details-content">
            <div class="modal-heading">
                <h2>Opportunity Details</h2>
                <button type="button" id="closeDetailsButton" class="close-button"
                    aria-label="Close details">&times;</button>
            </div>
            <div id="detailsContent"></div>
        </div>
    </div>

    <footer>
        <p>University Research Opportunity Portal</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
