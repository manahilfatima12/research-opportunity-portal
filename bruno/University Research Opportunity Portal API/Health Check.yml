info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/health"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Health check returns 200', function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
