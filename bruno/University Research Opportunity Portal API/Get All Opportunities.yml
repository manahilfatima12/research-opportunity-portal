info:
  name: Get All Opportunities
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/opportunities"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('List opportunities returns 200', function () {
            expect(res.getStatus()).to.equal(200);
        });
        test('Response is a JSON array', function () {
            expect(res.getBody()).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
